[project]
name = "deq-tune-backend"
version = "0.1.0"
description = "DEQ Tune backend: serves and stores Pioneer DEQ equalizer profiles."
requires-python = ">=3.13"
dependencies = [
    "fastapi>=0.141.1",
    "sqlmodel>=0.0.42",
    "uvicorn[standard]>=0.53.0",
]

[project.optional-dependencies]
# Talking to a real DEQ over USB. The app runs without this: the default
# transport is the fake unit, and CI never touches hardware.
usb = ["pyusb>=1.3.1"]
# Talking to a real DEQ through an ESP bridge over a serial link. Same
# story as `usb`: optional, CI never touches hardware.
esp-bridge = ["pyserial>=3.5"]

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "pytest>=9.1.1",
]

[tool.pytest.ini_options]
# The backend root, so `app` imports from a test anywhere under it. The
# console lives in `scripts/` with its test beside it, which is the rule
# this repo follows everywhere else.
pythonpath = ["."]
