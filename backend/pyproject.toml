[project]
name = "deq-tune-backend"
version = "0.1.0"
description = "DEQ Tune backend: serves and stores Pioneer DEQ equalizer profiles."
requires-python = ">=3.13"
dependencies = [
    "fastapi>=0.141.1",
    "sqlmodel>=0.0.42",
    "uvicorn[standard]>=0.53.0",
]

[project.optional-dependencies]
# Talking to a real DEQ over USB. The app runs without this: the default
# transport is the fake unit, and CI never touches hardware.
usb = ["pyusb>=1.3.1"]

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "pytest>=9.1.1",
]
